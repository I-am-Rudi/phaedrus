appId: io.github.I_am_Rudi.Phaedrus
productName: Phaedrus
artifactName: ${productName}-${version}-${os}-${arch}.${ext}
directories:
  output: dist
  buildResources: build
files:
  - out/**
  - package.json
asarUnpack:
  - node_modules/harper.js/**
  - node_modules/pdfjs-dist/**
publish:
  provider: github
  releaseType: draft
linux:
  target: [AppImage, deb, rpm]
  category: Office
  maintainer: Rudi Siebert <k.r.siebert@icloud.com>
  icon: build/icons
mac:
  target: [dmg, zip]
  category: public.app-category.productivity
  hardenedRuntime: true
  # Without a Developer ID certificate, sign ad hoc so Apple Silicon and Intel
  # builds both carry a valid signature; a real identity from CSC_LINK wins.
  identity: '-'
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  icon: build/icon-mac.png
win:
  target: nsis
  icon: build/icon.png
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
