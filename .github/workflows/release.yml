# Builds installers for macOS, Windows and Linux when a version tag is pushed,
# and attaches them to a draft GitHub release.
#
#   npm version 0.2.0      # bumps package.json and creates the tag v0.2.0
#   git push --follow-tags
#
# Signing is optional. Without the secrets below the macOS and Windows builds
# are unsigned (macOS Gatekeeper and Windows SmartScreen will warn on first launch).
#   macOS:   MAC_CERTIFICATE (base64 .p12), MAC_CERTIFICATE_PASSWORD,
#            APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID (notarization)
#   Windows: WIN_CERTIFICATE (base64 .pfx), WIN_CERTIFICATE_PASSWORD

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
        env: { ELECTRON_SKIP_BINARY_DOWNLOAD: '1' }
      - run: npm run typecheck
      - run: npm test
      - name: Tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        run: test "v$(node -p 'require("./package.json").version')" = "${GITHUB_REF_NAME}"

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: --mac --arm64 --x64
          - os: windows-latest
            args: --win --x64
          - os: ubuntu-latest
            args: --linux --x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build
      - name: Package and upload to the draft release
        # Repository URL and release target come from GitHub's context, so the
        # config needs no hard-coded owner (the .deb requires a homepage).
        run: >-
          npx electron-builder ${{ matrix.args }}
          --publish ${{ startsWith(github.ref, 'refs/tags/v') && 'always' || 'never' }}
          -c.publish.owner=${{ github.repository_owner }}
          -c.publish.repo=${{ github.event.repository.name }}
          -c.extraMetadata.homepage=https://github.com/${{ github.repository }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ runner.os == 'macOS' && secrets.MAC_CERTIFICATE || secrets.WIN_CERTIFICATE }}
          CSC_KEY_PASSWORD: ${{ runner.os == 'macOS' && secrets.MAC_CERTIFICATE_PASSWORD || secrets.WIN_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - name: Keep the installers as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: phaedrus-${{ runner.os }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
          if-no-files-found: ignore
